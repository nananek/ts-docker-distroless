name: nightly

on:
  schedule:
    # Tailscale publishes the nightly (unstable-v*) image around 00:00 UTC.
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      tailscale_tag:
        description: "Tailscale image tag (empty = newest unstable-v*)"
        required: false
        type: string

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image and Tailscale tag
        id: vars
        env:
          TAILSCALE_TAG: ${{ inputs.tailscale_tag }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="$(./scripts/latest-unstable-tag.sh)"
          echo "image=$image" >>"$GITHUB_OUTPUT"
          echo "tailscale_tag=$tag" >>"$GITHUB_OUTPUT"
          echo "Using Tailscale ${tag} for ${image}"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly-{{date 'YYYYMMDD'}}
            type=raw,value=${{ steps.vars.outputs.tailscale_tag }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=tailscale-distroless
            org.opencontainers.image.description=Tailscale nightly on distroless/static; Tailscale SSH is disabled by seccomp
            org.opencontainers.image.version=${{ steps.vars.outputs.tailscale_tag }}
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Metadata (TUN)
        id: meta-tun
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=tun
            type=raw,value=tun-nightly-{{date 'YYYYMMDD'}}
            type=raw,value=tun-${{ steps.vars.outputs.tailscale_tag }}
            type=sha,prefix=tun-sha-,format=short
          labels: |
            org.opencontainers.image.title=tailscale-distroless-tun
            org.opencontainers.image.description=Tailscale nightly on distroless/base with iptables/iproute2 for TUN mode; Tailscale SSH is disabled by seccomp
            org.opencontainers.image.version=${{ steps.vars.outputs.tailscale_tag }}
            org.opencontainers.image.licenses=BSD-3-Clause

      - name: Build amd64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ts-distroless:nightly-smoke
          build-args: |
            TAILSCALE_IMAGE=ghcr.io/tailscale/tailscale:${{ steps.vars.outputs.tailscale_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ./scripts/smoke-test.sh ts-distroless:nightly-smoke

      - name: Build TUN amd64 for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tun
          platforms: linux/amd64
          load: true
          tags: ts-distroless-tun:nightly-smoke
          build-args: |
            TAILSCALE_IMAGE=ghcr.io/tailscale/tailscale:${{ steps.vars.outputs.tailscale_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: TUN smoke test
        run: ./scripts/smoke-test-tun.sh ts-distroless-tun:nightly-smoke

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TAILSCALE_IMAGE=ghcr.io/tailscale/tailscale:${{ steps.vars.outputs.tailscale_tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push TUN
        id: build-tun
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tun
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta-tun.outputs.tags }}
          labels: ${{ steps.meta-tun.outputs.labels }}
          build-args: |
            TAILSCALE_IMAGE=ghcr.io/tailscale/tailscale:${{ steps.vars.outputs.tailscale_tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### tailscale-distroless"
            echo
            echo "- Tailscale: \`${{ steps.vars.outputs.tailscale_tag }}\`"
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Tags:"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo "- TUN digest: \`${{ steps.build-tun.outputs.digest }}\`"
            echo "- TUN tags:"
            echo '```'
            echo "${{ steps.meta-tun.outputs.tags }}"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
